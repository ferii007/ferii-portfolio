name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, where Playwright's system dependencies may not be packaged yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      # e2e runs against `npm run dev` (playwright.config.js starts it); CI=true makes it start a fresh server.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
